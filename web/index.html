<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <div id="topBar" class="panel">
      <div class="button-row">
        <button id="top-drop0" class="sound-btn" data-panel="top" data-id="drop0">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="top-drop1" class="sound-btn" data-panel="top" data-id="drop1">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="top-drop2" class="sound-btn" data-panel="top" data-id="drop2">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="top-drop3" class="sound-btn" data-panel="top" data-id="drop3">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="top-drop4" class="sound-btn" data-panel="top" data-id="drop4">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="top-drop5" class="sound-btn" data-panel="top" data-id="drop5">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="top-drop6" class="sound-btn" data-panel="top" data-id="drop6">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="top-drop7" class="sound-btn" data-panel="top" data-id="drop7">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="top-drop8" class="sound-btn" data-panel="top" data-id="drop8">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="top-drop9" class="sound-btn" data-panel="top" data-id="drop9">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
      </div>
    </div>

    <!-- Main Content Area -->
    <div id="mainContent">
      <!-- Left Bar -->
      <div id="leftBar" class="panel side-panel">
        <button id="left-drop0" class="sound-btn" data-panel="left" data-id="drop0">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="left-drop1" class="sound-btn" data-panel="left" data-id="drop1">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="left-drop2" class="sound-btn" data-panel="left" data-id="drop2">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="left-drop3" class="sound-btn" data-panel="left" data-id="drop3">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="left-drop4" class="sound-btn" data-panel="left" data-id="drop4">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="left-drop5" class="sound-btn" data-panel="left" data-id="drop5">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="left-drop6" class="sound-btn" data-panel="left" data-id="drop6">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="left-drop7" class="sound-btn" data-panel="left" data-id="drop7">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="left-drop8" class="sound-btn" data-panel="left" data-id="drop8">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="left-drop9" class="sound-btn" data-panel="left" data-id="drop9">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
      </div>

      <!-- Center - Image Display -->
      <div id="centerDisplay">
        <img id="displayImage" src="" alt="Display">
      </div>

      <!-- Right Bar -->
      <div id="rightBar" class="panel side-panel">
        <button id="right-drop0" class="sound-btn" data-panel="right" data-id="drop0">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="right-drop1" class="sound-btn" data-panel="right" data-id="drop1">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="right-drop2" class="sound-btn" data-panel="right" data-id="drop2">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="right-drop3" class="sound-btn" data-panel="right" data-id="drop3">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="right-drop4" class="sound-btn" data-panel="right" data-id="drop4">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="right-drop5" class="sound-btn" data-panel="right" data-id="drop5">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="right-drop6" class="sound-btn" data-panel="right" data-id="drop6">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="right-drop7" class="sound-btn" data-panel="right" data-id="drop7">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="right-drop8" class="sound-btn" data-panel="right" data-id="drop8">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
        <button id="right-drop9" class="sound-btn" data-panel="right" data-id="drop9">
          <span class="label">Empty</span>
          <span class="keymap"></span>
        </button>
      </div>
    </div>

    <!-- Bottom Bar / Controls -->
    <div id="bottomBar">
      <button id="imageBtn" class="control-btn">Image</button>
      <button id="sampleBtn" class="control-btn">Sample</button>
      <button id="keyMapBtn" class="control-btn">Key Map</button>
      <div id="activePanel">
        <strong>Active Panels</strong>
        <label><input type="checkbox" id="leftCheck" checked> Left</label>
        <label><input type="checkbox" id="topCheck" checked> Top</label>
        <label><input type="checkbox" id="rightCheck" checked> Right</label>
      </div>
      <button id="extendedBtn" class="control-btn">Open Extended Display</button>
      <div id="credits">
        <a href="https://youtu.be/9AJimznZddA" target="_blank">Tutorial</a>
        <span>By Chad Cabrera</span>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
